# 牛来 NFT 静态资产：/meta/{id}.json  /img/{0001..0999}.png  /（落地页）
# 用法：把本文件放到 /etc/nginx/conf.d/niulai.conf，域名与证书按需改（推荐 certbot）
server {
    listen 80;
    listen 443 ssl http2;
    server_name niulai.example;                      # 改成你的域名
    # ssl_certificate     /etc/letsencrypt/live/niulai.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/niulai.example/privkey.pem;

    root /var/www/niulai;                            # deploy.sh 会同步到这里
    index index.html;
    gzip on; gzip_types application/json text/html text/css application/javascript;

    # 元数据：市场/钱包会跨域读，加 CORS；缓存 1 小时（想改属性时能生效）
    location /meta/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600" always;
        types { application/json json; }
        try_files $uri =404;
    }
    # 图片：不可变，长缓存
    location /img/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
