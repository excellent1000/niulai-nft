[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 800
evm_version = "cancun"
via_ir = false
ffi = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/",
  "@uniswap/v4-core/=lib/v4-core/",
  "solmate/=lib/v4-core/lib/solmate/",
  "v4-periphery/=lib/v4-periphery/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "permit2/=lib/v4-periphery/lib/permit2/",
]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"

[etherscan]
# BscScan 的 V1 接口(api.bscscan.com/api)已停用，必须走 Etherscan V2 多链接口
bsc = { key = "${BSCSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=56", chain = 56 }
