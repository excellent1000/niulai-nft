<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>牛来 NFT</title>
<meta name="description" content="牛来 NFT" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<style>
  :root {
    --bg:#0f0d0c; --panel:#171211; --panel2:#221a17; --line:#3a2e28; --ink:#f3ede4; --dim:#b8ada0;
    --yellow:#ffe066; --gold:#e3c93a; --red:#c8412b; --sky:#7fb2d9; --sky2:#b9dff0;
    --checker: repeating-conic-gradient(#ff00dc 0 25%, #141414 0 50%) 0 0/18px 18px;
    --font: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --kai: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif CJK SC", serif;
  }
  * { box-sizing:border-box } html { scroll-behavior:smooth }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 var(--font); overflow-x:hidden; cursor:url(assets/cursor.png) 16 16, auto; }
  a { color:var(--yellow) }

  /* 影院黑边 + 颗粒 + 暗角 */
  .bar { position:fixed; left:0; right:0; height:22px; background:#050404; z-index:50; pointer-events:none } .bar.top { top:0 } .bar.bottom { bottom:0 }
  .grain { position:fixed; inset:0; z-index:49; pointer-events:none; opacity:.18; mix-blend-mode:overlay;
           background-image: repeating-radial-gradient(circle at 17% 33%, #fff 0 1px, transparent 1px 3px), repeating-radial-gradient(circle at 63% 71%, #000 0 1px, transparent 1px 4px); background-size: 7px 7px, 11px 11px; }
  .vignette { position:fixed; inset:0; z-index:48; pointer-events:none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

  .wrap { max-width:1100px; margin:0 auto; padding:44px 20px 120px; position:relative; z-index:2 }
  .shouchuo { font-weight:900; color:var(--yellow); -webkit-text-stroke:1px #000; letter-spacing:1px;
              text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 6px 6px 0 rgba(0,0,0,.35); }
  header { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:24px }
  header h1 { margin:0; font-size:34px; line-height:1.1; transform: rotate(-1.2deg) }
  header h1 small { display:block; font-size:12px; color:var(--dim); -webkit-text-stroke:0; text-shadow:none; letter-spacing:3px; margin-top:6px }
  nav a { color:var(--dim); text-decoration:none; margin-right:14px; font-size:14px; font-weight:700 } nav a:hover { color:var(--yellow) }
  .toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
  .tok { color:var(--dim); text-decoration:none; font:700 13px ui-monospace, Menlo, monospace; border:2px solid #111; background:var(--panel2); padding:8px 10px; border-radius:6px; box-shadow:3px 3px 0 #111; white-space:nowrap }
  .tok span { color:var(--yellow) } .tok:hover { color:var(--ink) }
  @media (max-width:820px){ .tok span { display:inline-block; max-width:150px; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom } }
  #bgmBtn { font:900 18px var(--font); cursor:pointer; opacity:.55 } #bgmBtn.on { opacity:1; color:var(--yellow); animation: pulse 1.2s ease-in-out infinite alternate }
  @keyframes pulse { from { transform:scale(1) } to { transform:scale(1.15) } }
  .xlink { display:inline-grid; place-items:center; width:40px; height:40px; color:var(--ink); background:var(--panel2); border:2px solid #111; border-radius:6px; box-shadow:3px 3px 0 #111 } .xlink:hover { color:var(--yellow) }
  html.poster .tok, html.poster .xlink { background:#efe9dc; color:#1f1f1f; border-color:var(--line); box-shadow:none } html.poster .tok span { color:#c8412b }


  .btn { background:var(--gold); color:#1a1200; border:3px solid #111; border-radius:6px; padding:12px 18px; font:900 16px var(--font);
         box-shadow:5px 5px 0 #111; cursor:pointer; transform:skew(-2deg); transition:transform .08s, box-shadow .08s; text-decoration:none; display:inline-block }
  .btn:hover { transform:skew(-2deg) translate(2px,2px); box-shadow:3px 3px 0 #111; background-image:var(--checker); background-blend-mode:screen }
  .btn:active { transform:skew(-2deg) translate(5px,5px); box-shadow:0 0 0 #111 }
  .btn.ghost { background:var(--panel2); color:var(--ink) }
  .btn:disabled { opacity:.5; cursor:not-allowed; transform:skew(-2deg); box-shadow:5px 5px 0 #111; background-image:none }
  .switch { display:inline-flex; border:3px solid #111; border-radius:6px; overflow:hidden; box-shadow:4px 4px 0 #111; background:#111 }
  .switch button { border:0; padding:8px 12px; font:900 13px var(--font); background:#2a2118; color:var(--dim); cursor:pointer }
  .switch button.on { background:var(--gold); color:#1a1200 }

  /* 英雄区：银幕 */
  .hero { display:grid; grid-template-columns:1.25fr .9fr; gap:28px; align-items:center; margin:8px 0 34px }
  @media (max-width:820px){ .hero { grid-template-columns:1fr } }
  .screen { position:relative; background:#000; border:6px solid #050404; border-radius:6px; box-shadow:0 0 0 2px #2a2118, 0 30px 60px rgba(0,0,0,.6);
            transform: perspective(900px) rotateY(-3deg) rotateX(1deg); }
  .screen .film { position:relative; aspect-ratio:3/2; overflow:hidden; background:#000; display:grid; grid-template-rows:repeat(4,1fr); }
  .strip { position:relative; overflow:hidden; background:#000; border-top:2px solid #1a1616; border-bottom:2px solid #1a1616 }
  .strip::before, .strip::after { content:""; position:absolute; left:0; right:0; height:9px; z-index:2; pointer-events:none;
     background: repeating-linear-gradient(90deg, transparent 0 10px, #4a4238 10px 22px, transparent 22px 32px); opacity:.85 }
  .strip::before { top:2px } .strip::after { bottom:2px }
  .strip { overflow-x:hidden; overflow-y:hidden; scrollbar-width:none } .strip::-webkit-scrollbar { display:none }
  .track { display:flex; gap:6px; width:max-content; height:100%; padding:13px 0; box-sizing:border-box }
  .track img { height:100%; width:auto; display:block; filter:contrast(1.05) saturate(1.05); border-left:1px solid #000; border-right:1px solid #000 }
  .screen .glare { position:absolute; inset:0; background: radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.18), transparent 42%); pointer-events:none; z-index:3 }
  .seats { height:38px; margin:10px 6px 0; background: repeating-linear-gradient(90deg, #4a1515 0 46px, transparent 46px 56px); border-radius:8px 8px 0 0; opacity:.9; position:relative }
  .seats::after { content:""; position:absolute; inset:0; background: repeating-linear-gradient(90deg, transparent 0 46px, #0e0c0b 46px 56px); }
  .headline h2 { margin:0 0 12px; font-size:clamp(24px, 3.4vw, 40px); line-height:1.15 }
  .headline p { margin:0 0 10px }
  .pill { display:inline-block; padding:3px 10px; border:2px solid #111; background:#2a2118; color:var(--yellow); font-size:12px; font-weight:800; margin:0 6px 6px 0; box-shadow:2px 2px 0 #000; transform:rotate(-1deg) }
  .pill:nth-child(2n){ transform:rotate(1.2deg) }

  /* 步骤条 */
  .subs { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:0 0 30px }
  @media (max-width:820px){ .subs { grid-template-columns:1fr 1fr } }
  .sub { background:linear-gradient(180deg,#131010,#0a0808); border:2px solid #000; padding:14px 14px 12px; transform:rotate(-.6deg) }
  .sub:nth-child(2n){ transform:rotate(.7deg) } .sub b { display:block; color:var(--yellow); font-size:15px; margin-bottom:6px }
  .sub span { color:#fff; font-weight:700; text-shadow:2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; font-size:14px }

  /* 面板 */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px } @media (max-width:820px){ .grid { grid-template-columns:1fr } }
  .card { background:var(--panel); border:3px solid #000; box-shadow:8px 8px 0 #000; padding:20px; position:relative; transform:rotate(-.4deg) }
  .card:nth-child(2){ transform:rotate(.5deg) }
  .mintout { position:absolute; right:14px; top:14px; padding:6px 14px; border:4px double var(--red); color:var(--red); font:900 26px/1 var(--font); letter-spacing:3px; transform:rotate(-12deg); text-transform:uppercase; opacity:.92; pointer-events:none; text-shadow:none; -webkit-text-stroke:0; background:rgba(0,0,0,.25) }
  html.poster .mintout { background:rgba(255,255,255,.4) }
  #mint.out .qty, #mint.out #approve { display:none }
  .card h2 { margin:0 0 12px; font-size:20px } .muted { color:var(--dim); font-size:14px }
  .row { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px dashed var(--line); font-variant-numeric:tabular-nums } .row:last-child { border:0 }
  .kpi { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:6px 0 12px }
  .kpi div { background:#0b0908; border:2px solid #000; padding:10px 12px } .kpi small { display:block; color:var(--dim); font-size:12px } .kpi strong { font-size:22px; color:var(--gold); font-weight:900 }
  .qty { display:flex; align-items:center; gap:10px; margin:12px 0 } .qty input { width:70px; padding:10px; border:3px solid #000; background:#0b0908; color:var(--ink); font:900 20px var(--font); text-align:center }
  .bar2 { height:16px; background:#0b0908; border:2px solid #000; margin:6px 0 10px; position:relative; overflow:hidden }
  .bar2 i { display:block; height:100%; background:var(--checker); transition:width 1s }
  .markets { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px } .markets a { border:2px solid #000; background:#0b0908; padding:8px 12px; text-decoration:none; color:var(--ink); font-size:14px; font-weight:700; box-shadow:3px 3px 0 #000 }
  #log { font-family:ui-monospace, Menlo, monospace; font-size:12px; color:#fff; white-space:pre-wrap; max-height:150px; overflow:auto; background:rgba(0,0,0,.75); border:2px solid #000; padding:12px; margin-top:18px; text-shadow:1px 1px 0 #000 } #log:empty { display:none }

  /* 角色巡游 */
  .parade { position:relative; height:420px; margin:36px -20px 0; overflow:hidden; border-top:6px solid #000; border-bottom:6px solid #000;
            background: linear-gradient(180deg, var(--sky2) 0%, var(--sky) 55%, #5b8f47 55.2%, #5b8f47 100%); }
  .parade .grass { position:absolute; left:0; right:0; bottom:0; height:45%; background:url(assets/grass-tile.png) repeat; background-size:256px 256px; image-rendering:pixelated; opacity:.95 }
  .parade .grass::after { content:""; position:absolute; inset:0; background: repeating-linear-gradient(90deg, transparent 0 255px, rgba(0,0,0,.28) 255px 256px), repeating-linear-gradient(0deg, transparent 0 255px, rgba(0,0,0,.28) 255px 256px); }
  .parade .rock { position:absolute; left:6%; bottom:44%; width:140px; height:80px; background:#8a7a66; clip-path:polygon(0 100%, 12% 30%, 40% 0, 70% 15%, 100% 55%, 100% 100%); }
  .parade .rock::after { content:""; position:absolute; left:34%; bottom:0; width:38%; height:55%; background:#1e1815; clip-path:polygon(0 100%, 20% 0, 80% 0, 100% 100%) }
  .parade .tree { position:absolute; right:10%; bottom:44%; width:14px; height:70px; background:#6b4a2b } .parade .tree::after { content:""; position:absolute; left:-32px; top:-46px; width:78px; height:60px; background:#3e6a30; border-radius:50% }
  .parade img { position:absolute; bottom:6%; height:200px; filter:drop-shadow(0 6px 4px rgba(0,0,0,.35)); transition:left 6s linear, bottom .3s; transform-origin:50% 100% }
  .parade img.flip { transform:scaleX(-1) }
  .a-idle { animation: bob 2.6s ease-in-out infinite alternate }
  .a-walk { animation: walkbob .5s ease-in-out infinite alternate }
  .a-jump { animation: jump .8s cubic-bezier(.3,1.4,.4,1) 1 }
  .a-spin { animation: spin 1.4s ease-in-out 1 }
  .a-sway { animation: sway 3s ease-in-out infinite alternate }
  .a-glitch { animation: jitter .25s steps(2) 5 }
  .flip.a-idle { animation-name: bobf } .flip.a-walk { animation-name: walkbobf } .flip.a-jump { animation-name: jumpf }
  @keyframes bob { from { transform:translateY(0) rotate(-1deg) } to { transform:translateY(-10px) rotate(1.5deg) } }
  @keyframes bobf { from { transform:scaleX(-1) translateY(0) rotate(-1deg) } to { transform:scaleX(-1) translateY(-10px) rotate(1.5deg) } }
  @keyframes walkbob { from { transform:translateY(0) rotate(-3deg) } to { transform:translateY(-14px) rotate(3deg) } }
  @keyframes walkbobf { from { transform:scaleX(-1) translateY(0) rotate(-3deg) } to { transform:scaleX(-1) translateY(-14px) rotate(3deg) } }
  @keyframes jump { 0%{transform:translateY(0) scale(1,1)} 15%{transform:translateY(6px) scale(1.08,.9)} 50%{transform:translateY(-90px) scale(.95,1.08)} 85%{transform:translateY(4px) scale(1.06,.94)} 100%{transform:translateY(0)} }
  @keyframes jumpf { 0%{transform:scaleX(-1) translateY(0)} 15%{transform:scaleX(-1.08) translateY(6px) scaleY(.9)} 50%{transform:scaleX(-.95) translateY(-90px) scaleY(1.08)} 100%{transform:scaleX(-1) translateY(0)} }
  @keyframes spin { from { transform:rotate(0) } to { transform:rotate(360deg) } }
  @keyframes sway { from { transform:rotate(-7deg) } to { transform:rotate(7deg) } }
  @keyframes jitter { 0%{transform:translate(0,0)} 25%{transform:translate(3px,-2px) rotate(1deg)} 50%{transform:translate(-3px,2px) rotate(-1deg)} 100%{transform:translate(0,0)} }
  .parade img:hover { animation: jitter .3s steps(2) infinite; cursor:url(assets/cursor.png) 16 16, pointer }
  .fly { position:absolute; top:6%; height:110px !important; bottom:auto; transition:none; animation: fly var(--dur,26s) linear 1 forwards } .fly.flip { animation-name: flyback }
  @keyframes fly { 0% { left:-160px; margin-top:0 } 25% { margin-top:26px } 50% { margin-top:-10px } 75% { margin-top:30px } 100% { left:110vw; margin-top:0 } }
  @keyframes flyback { 0% { left:110vw; margin-top:0; transform:scaleX(-1) } 30% { margin-top:28px } 60% { margin-top:-12px } 100% { left:-160px; margin-top:0; transform:scaleX(-1) } }
  /* FAQ */
  details { background:var(--panel); border:3px solid #000; box-shadow:5px 5px 0 #000; padding:12px 16px; margin-bottom:12px; transform:rotate(-.3deg) }
  details:nth-child(2n){ transform:rotate(.4deg) } summary { cursor:pointer; font-weight:900; color:var(--yellow) } summary::marker { color:var(--red) }
  details p { margin:8px 0 0 } footer { margin-top:44px; color:var(--dim); font-size:13px; text-align:center }

  /* 水墨主题 */
  html.poster { --bg:#f4f0e6; --panel:#faf7f0; --panel2:#efe9dc; --line:#cfc7b2; --ink:#1f1f1f; --dim:#5a544c; --yellow:#1f1f1f; --gold:#c8412b; --checker:none; }
  html.poster body { background: var(--bg) radial-gradient(circle at 20% 10%, rgba(0,0,0,.04), transparent 40%), radial-gradient(circle at 80% 70%, rgba(0,0,0,.05), transparent 45%); font-family: var(--kai); }
  html.poster .bar, html.poster .grain, html.poster .vignette { display:none }
  html.poster .shouchuo { color:#1f1f1f; -webkit-text-stroke:0; text-shadow:none; letter-spacing:4px; font-family:var(--kai) }
  html.poster .btn { background:#1f1f1f; color:#f4f0e6; border-color:#1f1f1f; box-shadow:4px 4px 0 #c8412b; transform:none } html.poster .btn:hover { background:#c8412b; background-image:none }
  html.poster .btn.ghost { background:#efe9dc; color:#1f1f1f } html.poster .btn:disabled { background:#cfc7b2; color:#f4f0e6 }
  html.poster .card, html.poster details, html.poster .sub { box-shadow:none; border:1px solid var(--line); transform:none; background:var(--panel) }
  html.poster .sub span, html.poster .sub b { color:#1f1f1f; text-shadow:none } html.poster .sub b { color:#c8412b }
  html.poster .kpi div, html.poster .qty input, html.poster #log, html.poster .markets a { background:#efe9dc; color:#1f1f1f; border-color:var(--line); text-shadow:none; box-shadow:none }
  html.poster .kpi strong, html.poster .row b { color:#c8412b } html.poster .pill { background:#efe9dc; color:#1f1f1f; border-color:var(--line); box-shadow:none; transform:none }
  html.poster .bar2 { background:#efe9dc } html.poster .bar2 i { background:#5f8f7a }
  html.poster .parade { background:#f4f0e6; border-color:var(--line) } html.poster .parade .grass, html.poster .parade .rock, html.poster .parade .tree { display:none }
  html.poster .parade img { filter: brightness(0) contrast(1); opacity:.9 }
  html.poster summary { color:#1f1f1f } html.poster .switch { box-shadow:none; border-color:#1f1f1f } html.poster .switch button.on { background:#1f1f1f; color:#f4f0e6 }
  html.poster .screen, html.poster .seats { display:none }
  .inkposter { display:none; position:relative; aspect-ratio:1/1; background:#f4f0e6; border:1px solid var(--line); overflow:hidden }
  html.poster .inkposter { display:block }
  .inkposter .mtn, .inkposter .mtn2 { position:absolute; left:-4%; top:8%; height:40%; filter:blur(2px); }
  .inkposter .mtn { right:34%; background:linear-gradient(180deg,#2e2e2c,#8a8a86 65%, transparent); opacity:.62;
      clip-path:polygon(0 100%, 5% 62%, 13% 28%, 21% 54%, 29% 16%, 39% 50%, 47% 8%, 57% 44%, 66% 22%, 76% 56%, 86% 34%, 100% 72%, 100% 100%); }
  .inkposter .mtn2 { right:16%; top:14%; height:36%; background:linear-gradient(180deg,#8a8a86,#c9c9c4 60%, transparent); opacity:.5;
      clip-path:polygon(0 100%, 8% 58%, 18% 30%, 28% 60%, 38% 22%, 50% 52%, 60% 14%, 72% 48%, 84% 30%, 94% 62%, 100% 50%, 100% 100%); }
  .inkposter .river { position:absolute; left:-20%; top:40%; width:140%; height:26%; background:#5f8f7a; opacity:.45; filter:blur(4px); border-radius:50% 50% 30% 30%/60% 60% 40% 40%; transform:rotate(-14deg) }
  .inkposter .title { position:absolute; left:8%; bottom:8%; font:900 150px/1 var(--kai); color:#1f1f1f; writing-mode:vertical-rl; letter-spacing:10px; transform:rotate(-3deg); opacity:.92 }
  .inkposter .bull { position:absolute; left:52%; top:34%; height:26%; filter:brightness(0); z-index:1 }
  .inkposter .cape { position:absolute; left:50%; top:37%; width:13%; height:10%; background:#c8412b; border-radius:45% 45% 60% 60%/40% 40% 70% 70%; transform:rotate(-10deg); z-index:0; opacity:.95 }
  .inkposter .seal2 { position:absolute; right:8%; bottom:12%; width:44px; height:44px; background:#c8412b; color:#fff; display:grid; place-items:center; font:900 20px var(--kai); transform:rotate(4deg) }

  @media (prefers-reduced-motion: reduce) { .track, .fly, .parade img, .parade img:hover { animation:none !important } }
</style>
</head>
<body>
<div class="bar top"></div><div class="bar bottom"></div><div class="grain"></div><div class="vignette"></div>
<audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>

<div class="wrap">
  <header>
    <h1 class="shouchuo">牛来 NFT</h1>
    <div class="toolbar">
      <a class="tok" id="tokAddr" href="https://bscscan.com/token/0xbeea1d618e533a387d941f58a7d4c9b7bd377777" target="_blank" rel="noopener" title="点击复制地址">$牛来 <span>0xbeea1d618e533a387d941f58a7d4c9b7bd377777</span></a>
      <a class="xlink" href="https://x.com/Niulai_NFT" target="_blank" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
      <button class="xlink" id="bgmBtn" aria-label="背景音乐" title="背景音乐">♪</button>
      <div class="switch"><button id="modeFilm" class="on">正片</button><button id="modePoster">水墨</button></div>
      <span id="acct" class="muted"></span><button class="btn" id="connect">连接钱包</button>
    </div>
  </header>

  <section class="hero" style="grid-template-columns:1fr">
    <div>
      <div class="screen">
        <div class="film" id="film"></div>
        <div class="glare"></div>
      </div>
      <div class="seats"></div>
      <div class="inkposter">
        <div class="mtn2"></div><div class="mtn"></div><div class="river"></div>
        <img class="bull" src="assets/char-calf.png" alt="" /><div class="cape"></div>
        <div class="title">牛来</div><div class="seal2">牛</div>
      </div>
    </div>
  </section>

  <div class="grid">
    <div class="card" id="mint">
      <h2 class="shouchuo">铸造</h2><div class="mintout" id="mintout" hidden>Mint Out</div>
      <div class="kpi"><div><small>已铸造</small><strong><span id="minted">–</span> / 999</strong></div><div><small>单价</small><strong id="price">–</strong></div></div>
      <div class="bar2"><i id="bar" style="width:0%"></i></div>
      <div class="row"><span class="muted">我的 $牛来</span><span id="myToken">–</span></div>
      <div class="row"><span class="muted">每钱包上限</span><span id="maxPerWallet">–</span></div>
      <div class="row"><span class="muted">状态</span><span id="saleState">–</span></div>
      <div class="qty"><button class="btn ghost" id="minus">−</button><input id="qty" type="number" min="1" max="1" value="1" /><button class="btn ghost" id="plus">＋</button><span class="muted" id="total"></span></div>
      <div style="display:flex; gap:12px; flex-wrap:wrap"><button class="btn ghost" id="approve" disabled style="flex:1">授权 $牛来</button><button class="btn" id="mintBtn" disabled style="flex:1">Mint</button></div>
      <div class="markets"><a id="buyLink" href="#" target="_blank" rel="noopener">PancakeSwap 买 $牛来</a><a id="okxLink" href="#" target="_blank" rel="noopener">OKX NFT</a><a id="elementLink" href="#" target="_blank" rel="noopener">Element</a><a id="scanLink" href="#" target="_blank" rel="noopener">BscScan</a></div>
    </div>

    <div class="card" id="vault">
      <h2 class="shouchuo">金库</h2>
      <div class="kpi">
        <div><small>待买入 BNB</small><strong id="vaultBnb">–</strong></div>
        <div><small>累计分发 $牛来</small><strong id="distributed">–</strong></div>
      </div>
      <div class="row"><span class="muted">下次买入</span><span id="nextTime">–</span></div>
      <div class="row"><span class="muted">累计买入</span><span id="bought">–</span></div>
      <div class="row"><span class="muted">当前轮次</span><span id="round">–</span></div>
      <div class="row"><span class="muted">我持有的 NFT</span><span id="myCount">–</span></div>
      <div style="display:flex; gap:12px; margin-top:12px; flex-wrap:wrap">
        <button class="btn ghost" id="distribute" disabled>分发本轮</button>
        <a id="vaultScan" class="btn ghost" href="#" target="_blank" rel="noopener">金库合约</a>
      </div>

  </div>

  <div id="log"></div>
</div>

<section class="parade" id="parade">
  <div class="grass"></div><div class="rock"></div><div class="tree"></div>
</section>



<script src="assets/ethers.umd.min.js"></script>
<script type="module">
const { ethers } = window;

// ====== 部署后改这里（或 URL 参数覆盖：?nft=0x..&vault=0x..&rpc=http://127.0.0.1:8545） ======
const q = new URLSearchParams(location.search);
const CONFIG = {
  chainId: 56, chainHex: '0x38',
  rpcs: [q.get('rpc'), 'https://bsc-dataseed.bnbchain.org', 'https://bsc-dataseed1.defibit.io', 'https://bsc-dataseed1.ninicoin.io', 'https://bsc-rpc.publicnode.com', 'https://1rpc.io/bnb', 'https://bsc.drpc.org', 'https://bsc-dataseed.binance.org', 'https://binance.llamarpc.com'].filter(Boolean),
  nft: q.get('nft') || '0x5fd0d8FeCF408f61080cEa470249026d3e02fB3D',
  vault: q.get('vault') || '0x311188bef22479edE7bd29b61a7aE7D84bA6B55C',
  token: '0xBEEA1D618e533a387D941F58a7d4c9b7bD377777',
  okx: 'https://web3.okx.com/nft/collection/bsc/%E7%89%9B%E6%9D%A5-nft',
  element: 'https://element.market/collections/niulais',
  buy: 'https://pancakeswap.finance/swap?outputCurrency=0xBEEA1D618e533a387D941F58a7d4c9b7bD377777&chain=bsc',
};
const NFT_ABI = ['function totalSupply() view returns (uint256)', 'function price() view returns (uint256)', 'function maxPerWallet() view returns (uint32)',
  'function publicSaleActive() view returns (bool)', 'function allowlistSaleActive() view returns (bool)', 'function reserveRemaining() view returns (uint32)', 'function balanceOf(address) view returns (uint256)', 'function mint(uint32 qty)'];
const VAULT_ABI = ['function canHarvest() view returns (bool ready, uint256 available, uint256 nextTime)', 'function totalBnbSpent() view returns (uint256)',
  'function totalTokenBought() view returns (uint256)', 'function totalTokenDistributed() view returns (uint256)', 'function roundActive() view returns (bool)',
  'function roundId() view returns (uint256)', 'function remainingInRound() view returns (uint256)', 'function distribute(uint256 count)'];
const ERC20_ABI = ['function balanceOf(address) view returns (uint256)', 'function allowance(address,address) view returns (uint256)', 'function approve(address,uint256) returns (bool)'];
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent = `${new Date().toLocaleTimeString()} ${m}\n` + $('log').textContent; };
const fmt = (wei, d = 3) => Number(ethers.formatEther(wei)).toLocaleString(undefined, { maximumFractionDigits: d });
// 并发探测所有 RPC，用最快能回块高的那个（国内环境部分节点不通）；连上钱包后优先用钱包的节点读
const NET = ethers.Network.from(CONFIG.chainId);
async function probeRpc(url) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 5000);
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_chainId', params: [] }), signal: ctl.signal });
    const j = await r.json(); if (parseInt(j.result, 16) !== CONFIG.chainId) throw new Error('wrong chain'); return url;
  } finally { clearTimeout(t); }
}
let ro = null, roUrl = null;
async function pickRpc() {
  try { roUrl = await Promise.any(CONFIG.rpcs.map(probeRpc)); }
  catch { roUrl = CONFIG.rpcs[0]; }
  ro = new ethers.JsonRpcProvider(roUrl, NET, { staticNetwork: NET, batchMaxCount: 1 });
  return ro;
}
let signer, account, unitPrice = 0n, maxQty = 5;
const readProvider = () => (signer ? signer.provider : ro);
const nftR = () => new ethers.Contract(CONFIG.nft, NFT_ABI, readProvider());
const vaultR = () => new ethers.Contract(CONFIG.vault, VAULT_ABI, readProvider());
const tokenR = () => new ethers.Contract(CONFIG.token, ERC20_ABI, readProvider());
$('okxLink').href = CONFIG.okx; $('elementLink').href = CONFIG.element; $('buyLink').href = CONFIG.buy;
$('scanLink').href = `https://bscscan.com/address/${CONFIG.nft}`; $('vaultScan').href = `https://bscscan.com/address/${CONFIG.vault}`;


// ---- 银幕：4 行胶片，1/3 行向右，2/4 行向左（JS 驱动 scrollLeft，不产生大合成层）----
(function film() {
  const ids = [19,312,464,510,1,23,45,67,89,111,133,155,177,199,221,243,265,287,309,331,353,375,397,419,441,463,485,507,529,551,573,595,617,639,661,683,705,727,749,771,793,815,837,859,881,903,925,947];
  const rows = [ids.slice(0,12), ids.slice(12,24), ids.slice(24,36), ids.slice(36,48)];
  const speeds = [34, -40, 30, -46];   // px/s，正=向右（内容右移），负=向左
  const el = $('film'); const strips = [];
  rows.forEach((row, r) => {
    const strip = document.createElement('div'); strip.className = 'strip';
    const track = document.createElement('div'); track.className = 'track';
    for (const id of [...row, ...row]) { const im = document.createElement('img'); im.src = `assets/f/${id}.jpg`; im.alt = ''; im.decoding = 'async'; track.appendChild(im); }
    strip.appendChild(track); el.appendChild(strip);
    strips.push({ strip, track, v: speeds[r], paused: false });
    strip.addEventListener('mouseenter', () => strips[r].paused = true); strip.addEventListener('mouseleave', () => strips[r].paused = false);
  });
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = performance.now();
  function step(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (const s of strips) {
      const half = s.track.scrollWidth / 2; if (!half) continue;
      if (s.strip.scrollLeft === 0 && s.v > 0) s.strip.scrollLeft = half;   // 向右滚的先站到中段
      if (!s.paused && !reduced) {
        let x = s.strip.scrollLeft - s.v * dt;   // 内容右移 = scrollLeft 减小
        if (x <= 0) x += half; else if (x >= half) x -= half;
        s.strip.scrollLeft = x;
      }
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();

// ---- 大平地：演员系统（不同姿势的图当动画帧 + 走动/跳跃/转圈/挥手/摆动）----
(function parade() {
  const stage = $('parade'); if (!stage) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const W = () => stage.clientWidth;
  const ACTORS = [
    { frames: { idle:'char-calf.png', wave:'char-calf-raise.png', tpose:'char-calf-tpose.png', alt:'char-calf-dead.png' }, h:190, x:.08 },
    { frames: { idle:'char-leopard.png', wave:'char-leopard-raise.png', tpose:'char-leopard-tpose.png', alt:'char-leopard-cross.png' }, h:170, x:.24 },
    { frames: { idle:'char-mother.png', wave:'char-mother-raise.png', tpose:'char-mother-tpose.png' }, h:230, x:.44 },
    { frames: { idle:'char-wolfdog.png', wave:'char-wolfdog-raise.png', tpose:'char-wolfdog-tpose.png' }, h:175, x:.6 },
    { frames: { idle:'char-bull-stand.png', wave:'char-bull-raise.png', tpose:'char-bull-tpose.png', alt:'char-bull-tpose-one.png' }, h:180, x:.72 },
    { frames: { idle:'char-snake.png', tpose:'char-snake-tpose.png', wave:'char-snake-raise.png' }, h:230, x:.9, snake:true },
  ];
  const actors = ACTORS.map(a => {
    const img = document.createElement('img'); img.src = 'assets/' + a.frames.idle; img.alt = ''; img.style.height = a.h + 'px'; img.style.left = (a.x * 100) + '%';
    img.className = a.snake ? 'a-sway' : 'a-idle'; stage.appendChild(img);
    return { ...a, img, x: a.x * W(), busy:false };
  });
  const setFrame = (a, k) => { if (a.frames[k]) a.img.src = 'assets/' + a.frames[k]; };
  const setAnim = (a, cls) => { a.img.classList.remove('a-idle','a-walk','a-jump','a-spin','a-sway','a-glitch'); void a.img.offsetWidth; a.img.classList.add(cls); };
  const idle = a => { setFrame(a, 'idle'); setAnim(a, a.snake ? 'a-sway' : 'a-idle'); a.busy = false; };
  async function act(a) {
    if (a.busy || reduced) return; a.busy = true;
    const move = a.snake ? pick(['wave','tpose','glitch','wave']) : pick(['walk','walk','wave','jump','tpose','glitch','alt']);
    if (move === 'walk') {
      const dist = rnd(120, 360) * (Math.random() < .5 ? -1 : 1);
      let nx = Math.max(20, Math.min(W() - 220, a.x + dist)); const dir = nx - a.x;
      a.img.classList.toggle('flip', dir < 0); setAnim(a, 'a-walk');
      const secs = Math.abs(dir) / 55; a.img.style.transition = `left ${secs}s linear`; a.img.style.left = nx + 'px'; a.x = nx;
      setTimeout(() => idle(a), secs * 1000);
    } else if (move === 'wave') { setFrame(a, 'wave'); setAnim(a, 'a-idle'); setTimeout(() => idle(a), rnd(1200, 2200)); }
    else if (move === 'jump') { setAnim(a, 'a-jump'); setTimeout(() => idle(a), 900); }
    else if (move === 'tpose') { setFrame(a, 'tpose'); setAnim(a, a.snake ? 'a-sway' : 'a-spin'); setTimeout(() => idle(a), a.snake ? 2500 : 1500); }
    else if (move === 'glitch') { setAnim(a, 'a-glitch'); setTimeout(() => idle(a), 1300); }
    else if (move === 'alt') { setFrame(a, 'alt'); setAnim(a, 'a-idle'); setTimeout(() => idle(a), rnd(1500, 3000)); }
  }
  function loop() { const a = pick(actors); act(a); setTimeout(loop, rnd(700, 1800)); }
  if (!reduced) setTimeout(loop, 800);
  // 云雀：随机方向来回飞
  function lark() {
    const im = document.createElement('img'); im.src = 'assets/char-lark.png'; im.alt = ''; im.className = 'fly' + (Math.random() < .5 ? ' flip' : '');
    const dur = rnd(18, 30); im.style.setProperty('--dur', dur + 's'); im.style.top = rnd(2, 20) + '%'; im.style.height = rnd(90, 130) + 'px';
    stage.appendChild(im); setTimeout(() => { im.remove(); setTimeout(lark, rnd(2000, 9000)); }, dur * 1000);
  }
  if (!reduced) lark(); else { const im = document.createElement('img'); im.src = 'assets/char-lark.png'; im.className = 'fly'; im.style.animation = 'none'; im.style.left = '50%'; stage.appendChild(im); }
  // 路人牛群：不停横穿
  function bull() {
    const im = document.createElement('img'); im.src = 'assets/' + pick(['char-bull-tpose.png','char-bull-tpose-one.png','char-bull-stand.png']); im.alt = '';
    const rtl = Math.random() < .35; im.className = 'a-walk' + (rtl ? ' flip' : ''); im.style.height = rnd(160, 220) + 'px'; im.style.left = rtl ? (W() + 40) + 'px' : '-260px'; im.style.transition = 'none';
    stage.appendChild(im);
    const dur = rnd(28, 46);
    requestAnimationFrame(() => requestAnimationFrame(() => { im.style.transition = `left ${dur}s linear`; im.style.left = rtl ? '-260px' : (W() + 40) + 'px'; }));
    setTimeout(() => im.remove(), dur * 1000 + 100);
  }
  if (!reduced) { bull(); setInterval(bull, 24000); }
})();

// 背景音乐：尝试自动循环播放；被浏览器拦截则在第一次点击/触摸时启动；按钮可关，状态记住
(function bgm() {
  const a = $('bgm'), btn = $('bgmBtn'); a.volume = 0.5;
  let want = localStorage.getItem('niulai-bgm') !== 'off';
  const ui = () => { btn.classList.toggle('on', want && !a.paused); btn.title = (want && !a.paused) ? '背景音乐：播放中（点击暂停）' : '背景音乐：已暂停（点击播放）'; };
  const tryPlay = () => { if (!want) return; a.play().then(ui).catch(() => {}); };
  const kick = () => { tryPlay(); if (!a.paused || !want) { window.removeEventListener('pointerdown', kick); window.removeEventListener('keydown', kick); } };
  btn.onclick = e => { e.stopPropagation(); if (a.paused) { want = true; localStorage.setItem('niulai-bgm', 'on'); a.play().then(ui).catch(ui); } else { want = false; localStorage.setItem('niulai-bgm', 'off'); a.pause(); ui(); } };
  a.addEventListener('play', ui); a.addEventListener('pause', ui);
  tryPlay(); window.addEventListener('pointerdown', kick); window.addEventListener('keydown', kick); ui();
})();

// 点击代币地址：复制（仍可中键/右键打开 BscScan）
$('tokAddr').addEventListener('click', e => { e.preventDefault(); navigator.clipboard?.writeText('0xbeea1d618e533a387d941f58a7d4c9b7bd377777').then(() => { const el = $('tokAddr'); const t = el.title; el.title = '已复制'; el.style.borderColor = 'var(--gold)'; setTimeout(() => { el.title = t; el.style.borderColor = ''; }, 1200); }); });
// 主题切换
function setMode(poster) { document.documentElement.classList.toggle('poster', poster); $('modePoster').classList.toggle('on', poster); $('modeFilm').classList.toggle('on', !poster); localStorage.setItem('niulai-mode', poster ? 'poster' : 'film'); }
$('modePoster').onclick = () => setMode(true); $('modeFilm').onclick = () => setMode(false);
if (localStorage.getItem('niulai-mode') === 'poster') setMode(true);

const DEPLOYED = CONFIG.nft !== '0x0000000000000000000000000000000000000000';
let failCount = 0;
async function refresh() {
  if (!DEPLOYED) { $('saleState').textContent = '未开始'; $('minted').textContent = '0'; $('price').textContent = '–'; $('maxPerWallet').textContent = '–'; return; }
  if (!ro && !signer) await pickRpc();
  try {
    const nftRO = nftR(), vaultRO = vaultR(), tokenRO = tokenR();
    const [supply, price, mpw, pub0, al0, reserve] = await Promise.all([nftRO.totalSupply(), nftRO.price(), nftRO.maxPerWallet(), nftRO.publicSaleActive(), nftRO.allowlistSaleActive(), nftRO.reserveRemaining()]);
    failCount = 0;
    const publicCap = 999 - Number(reserve);                                   // 公售能铸到的上限 = 总量 − 团队预留
    const soldOut = CONFIG.mintOut || Number(supply) >= publicCap;
    const pub = pub0 && !soldOut, al = al0 && !soldOut;
    $('mint').classList.toggle('out', soldOut); $('mintout').hidden = !soldOut;
    $('mintBtn').textContent = soldOut ? 'Mint Out' : 'Mint';
    unitPrice = price;
    $('minted').textContent = supply; $('bar').style.width = `${Math.max(1.5, Number(supply) / 999 * 100)}%`;
    $('price').textContent = `${fmt(price, 0)} 牛来`; $('maxPerWallet').textContent = mpw; maxQty = Math.max(1, Number(mpw)); $('qty').max = maxQty; if (Number($('qty').value) > maxQty) { $('qty').value = maxQty; }
    $('saleState').textContent = soldOut ? 'Mint Out' : pub ? '公售进行中' : al ? '白名单阶段' : '未开始';
    updateTotal();
    if (account) {
      const [bal, allowance] = await Promise.all([tokenRO.balanceOf(account), tokenRO.allowance(account, CONFIG.nft)]);
      $('myToken').textContent = `${fmt(bal, 0)} 牛来`;
      const need = unitPrice * BigInt(Math.max(1, Number($('qty').value || 1)));
      const ok = allowance >= need;
      $('approve').disabled = !pub || ok; $('approve').textContent = ok ? '已授权' : '授权 $牛来';
      $('mintBtn').disabled = !(pub && ok && bal >= need);
    } else { $('approve').disabled = true; $('mintBtn').disabled = true; }
    const [ready, available, nextTime] = await vaultRO.canHarvest();
    $('vaultBnb').textContent = fmt(available, 4);
    $('nextTime').textContent = ready ? '现在（等待 keeper）' : new Date(Number(nextTime) * 1000).toLocaleString();
    const [spent, bought, dist, active, rid, rem] = await Promise.all([vaultRO.totalBnbSpent(), vaultRO.totalTokenBought(), vaultRO.totalTokenDistributed(), vaultRO.roundActive(), vaultRO.roundId(), vaultRO.remainingInRound()]);
    $('bought').textContent = `${fmt(spent)} BNB → ${fmt(bought, 0)} 牛来`;
    $('distributed').textContent = `${fmt(dist, 0)}`;
    $('round').textContent = active ? `#${rid} 分发中，剩 ${rem} 枚` : (rid > 0n ? `#${rid} 已完成` : '尚未开始');
    $('distribute').disabled = !(active && account);
    if (account) $('myCount').textContent = await nftRO.balanceOf(account);
  } catch (e) {
    failCount++; $('saleState').textContent = '读取中…（第 ' + failCount + ' 次重试）'; log('读取失败：' + (e.shortMessage || e.message) + (roUrl ? ' @ ' + roUrl : ''));
    ro = null; if (!signer) setTimeout(refresh, 2500);   // 换个节点再试
  }
}
function updateTotal() { const n = Number($('qty').value || 1); $('total').textContent = unitPrice ? `合计 ${fmt(unitPrice * BigInt(n), 0)} 牛来` : ''; }

async function connect() {
  if (!window.ethereum) return log('未检测到钱包，请使用 MetaMask / OKX Wallet / Binance Wallet 打开');
  const bp = new ethers.BrowserProvider(window.ethereum);
  await bp.send('eth_requestAccounts', []);
  const net = await bp.getNetwork();
  if (Number(net.chainId) !== CONFIG.chainId) {
    try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CONFIG.chainHex }] }); }
    catch (e) {
      if (e.code === 4902) await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CONFIG.chainHex, chainName: 'BNB Smart Chain', nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 }, rpcUrls: ['https://bsc-dataseed.binance.org'], blockExplorerUrls: ['https://bscscan.com'] }] });
      else throw e;
    }
  }
  signer = await new ethers.BrowserProvider(window.ethereum).getSigner();
  account = await signer.getAddress();
  $('acct').textContent = account.slice(0, 6) + '…' + account.slice(-4); $('connect').textContent = '已连接';
  log('已连接 ' + account); refresh();
}
async function approve() {
  const token = new ethers.Contract(CONFIG.token, ERC20_ABI, signer);
  try { const qty = Math.max(1, Math.min(maxQty, Number($('qty').value || 1))); const tx = await token.approve(CONFIG.nft, unitPrice * BigInt(qty));
    log('授权交易 ' + tx.hash); await tx.wait(); log('授权成功'); refresh(); }
  catch (e) { log('失败：' + (e.shortMessage || e.reason || e.message)); }
}
async function mint() {
  const qty = Math.max(1, Math.min(maxQty, Number($('qty').value || 1)));
  const nft = new ethers.Contract(CONFIG.nft, NFT_ABI, signer);
  try { const tx = await nft.mint(qty); log(`Mint ${qty} 枚，交易 ${tx.hash}`); await tx.wait(); log('铸造成功'); refresh(); }
  catch (e) { log('失败：' + (e.shortMessage || e.reason || e.message)); }
}
async function distribute() {
  const v = new ethers.Contract(CONFIG.vault, VAULT_ABI, signer);
  try { const tx = await v.distribute(250); log('分发交易 ' + tx.hash); await tx.wait(); log('本批分发完成'); refresh(); }
  catch (e) { log('失败：' + (e.shortMessage || e.reason || e.message)); }
}
$('connect').onclick = connect; $('mintBtn').onclick = mint; $('approve').onclick = approve; $('distribute').onclick = distribute;
$('plus').onclick = () => { $('qty').value = Math.min(maxQty, Number($('qty').value) + 1); updateTotal(); refresh(); };
$('minus').onclick = () => { $('qty').value = Math.max(1, Number($('qty').value) - 1); updateTotal(); refresh(); };
$('qty').oninput = () => { updateTotal(); refresh(); };
pickRpc().then(refresh); if (DEPLOYED) setInterval(refresh, 30000);
</script>
